name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ai_maliyet_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ai_maliyet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ai_maliyet_user"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://ai_maliyet_user:ci_password@localhost:5432/ai_maliyet_test
      PYTHONPATH: ${{ github.workspace }}/backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install pip-audit
      - name: Bagimlilik guvenlik taramasi
        run: pip-audit --strict || true
      - name: Testler
        run: pytest tests -q
