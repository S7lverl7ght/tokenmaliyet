name: Veri yenile ve yayinla

on:
  schedule:
    # 06:10 ve 18:10 TR (UTC+3) -> 03:10 ve 15:10 UTC
    - cron: "10 3,15 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ai_maliyet_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ai_maliyet_merkezi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ai_maliyet_user"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://ai_maliyet_user:ci_password@localhost:5432/ai_maliyet_merkezi
      PYTHONPATH: ${{ github.workspace }}/backend
      SITE_URL: ${{ vars.SITE_URL || 'https://tokenmaliyet.com' }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || 'omerktn55@gmail.com' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Semayi olustur
        run: |
          python scripts/init_dev_db.py
          python -m app.seed

      - name: Fiyatlari topla
        # Bazi saglayicilar API anahtari ister; biri basarisiz olsa da digerleri toplanir.
        continue-on-error: true
        run: |
          python scripts/bot.py --max-change-pct 30

      - name: Doviz kuru (TCMB)
        # TRY karsiliklari icin gerekli. Basarisiz olsa da site kur olmadan calisir.
        continue-on-error: true
        run: |
          python scripts/collect_fx.py

      - name: Golden test (bilinen 20 fiyat degismedi mi?)
        run: python scripts/check_golden.py

      - name: Statik site uret
        run: python scripts/export_static.py

      - name: Testler
        # ONEMLI: testler conftest.py'de drop_all yapar. Uretim semasini silmesin
        # diye AYRI veritabaninda kosar.
        env:
          DATABASE_URL: postgresql+psycopg://ai_maliyet_user:ci_password@localhost:5432/ai_maliyet_test
          TEST_DATABASE_URL: postgresql+psycopg://ai_maliyet_user:ci_password@localhost:5432/ai_maliyet_test
        run: |
          PGPASSWORD=ci_password psql -h localhost -U ai_maliyet_user -d ai_maliyet_merkezi \
            -c "CREATE DATABASE ai_maliyet_test OWNER ai_maliyet_user;" || true
          pytest tests tests_nodb -q

      - name: Supabase'e kalici gecmis yaz
        # GitHub Actions Postgres'i her calismada sifirlanir; gecmis Supabase'de kalir.
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          pip install "psycopg[binary]"
          python scripts/push_supabase.py

      - name: Fiyat degisimlerini bildir
        # Degisimler ARTIK Supabase'deki kalici gecmisten okunur.
        continue-on-error: true
        env:
          BILDIR_SECRET: ${{ secrets.BILDIR_SECRET }}
          SITE_URL: https://tokenmaliyet.com
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          python scripts/alert_changes_supabase.py --out data/alert_changes.json
          COUNT=$(python -c "import json;print(len(json.load(open('data/alert_changes.json'))['changes']))")
          echo "degisim sayisi: $COUNT"
          if [ "$COUNT" != "0" ]; then
            curl -sS -X POST "https://tokenmaliyet.com/api/bildir" \
              -H "Content-Type: application/json" \
              -H "x-bildir-secret: $BILDIR_SECRET" \
              --data @data/alert_changes.json | head -c 500
            echo ""
          fi

      - name: Degisiklik varsa commit et
        run: |
          git config user.name "TokenMaliyet Bot"
          git config user.email "bot@tokenmaliyet.local"
          git add tests/golden_prices.json data/ 2>/dev/null || true
          git diff --quiet --cached || git commit -m "veri: otomatik fiyat guncellemesi [skip ci]"
          git push || true

      - name: Cloudflare Pages'e yukle
        if: ${{ vars.CF_DEPLOY == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=tokenmaliyet
