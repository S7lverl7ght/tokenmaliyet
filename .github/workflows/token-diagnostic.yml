name: Token teshis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Token izinlerini test et
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== token oneki ==="
          echo "${CF_TOKEN:0:6}... (uzunluk: ${#CF_TOKEN})"
          echo ""
          echo "=== account id ==="
          echo "${CF_ACCOUNT:0:8}..."
          echo ""
          probe() {
            local label="$1"; local method="$2"; local path="$3"
            code=$(curl -s -o /tmp/body -w "%{http_code}" -X "$method" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4${path}")
            echo "$label -> HTTP $code"
            if [ "$code" != "200" ]; then
              head -c 300 /tmp/body
              echo ""
            fi
          }
          echo "=== IZIN TESTLERI ==="
          probe "hesap listesi        " GET "/accounts"
          probe "pages proje listesi  " GET "/accounts/${CF_ACCOUNT}/pages/projects"
          probe "pages proje detay    " GET "/accounts/${CF_ACCOUNT}/pages/projects/tokenmaliyet"
          probe "pages deployments    " GET "/accounts/${CF_ACCOUNT}/pages/projects/tokenmaliyet/deployments?per_page=1"
          probe "workers scripts      " GET "/accounts/${CF_ACCOUNT}/workers/scripts"
