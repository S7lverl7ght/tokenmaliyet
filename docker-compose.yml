# Yerel/üretim benzeri çalıştırma:  docker compose up -d
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ai_maliyet_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ai_maliyet_merkezi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_maliyet_user -d ai_maliyet_merkezi"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://ai_maliyet_user:${POSTGRES_PASSWORD}@db:5432/ai_maliyet_merkezi
      SITE_URL: ${SITE_URL:-http://localhost:8000}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN gerekli}
      APP_ENV: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build: .
    command: ["sh", "-c", "while true; do python scripts/bot.py --max-change-pct 50; sleep 43200; done"]
    environment:
      DATABASE_URL: postgresql+psycopg://ai_maliyet_user:${POSTGRES_PASSWORD}@db:5432/ai_maliyet_merkezi
      BOT_MAX_CHANGE_PCT: "50"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
